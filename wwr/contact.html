    <main>
        <h1>Contact Us</h1>
        <section>
            <h2>Our Staff</h2>
            <div class="employees-container">
                <figure class="employees-item">
                    <img src="images/employee1.jfif" alt="Employee1">
                    <figcaption>Jill Jenkins</figcaption>
                </figure>
                <figure class="employees-item">
                    <img src="images/employee2.jfif" alt="Employee2">
                    <figcaption>Megan Smith</figcaption>
                </figure>
                <figure class="employees-item">
                    <img src="images/employee3.jfif" alt="Employee3">
                    <figcaption>Mary Winters</figcaption>
                </figure>
            </div>
        </section>
        <section>
        <div class="main-container">
        <form class="main-container-item1">
            <div class="form-group">
                <label for="username">Name:</label>
                <input type="text" id="username" name="username">
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
            </div>
            <fieldset class="form-radio">
                <div class="form-radio-item">
                    <input type="radio" id="general" name="questiontype" value="general">
                    <label for="general">General Inquiry</label>
                </div>
                <div class="form-radio-item">                
                    <input type="radio" id="reservation" name="questiontype" value="reservation">
                    <label for="reservation">Reservation Question</label>
                </div>            
                <div class="form-radio-item">                
                    <input type="radio" id="suggestion" name="questiontype" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </div>
            </fieldset>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="10" cols="50"></textarea>
            </div>
            <div class="form-group form-checkbox">
                <input type="checkbox" id="subscribe" name="subscribe" value="subscribe">
                <label for="subscribe">Please subscribe me to the monthly newsletter:</label>
            </div>
            <div class="form-group form-button-container">
                <button type="submit">Contact Us</button>
            </div>  
        </form>
            <div class="contact-info main-container-item2">
            <ul>
                <li>Contact us at:</li>
                <li>901 Spruce Dr, Cody, WY 82414</li>
                <li>821-645-8748</li>
                <li>dryoarrafting@gmail.com</li>
                <li><div class="map">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4304.24081371902!2d-109.0753559956907!3d44.53118490994934!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x534c1edc3c5d4a51%3A0xca6291cd355b8477!2s901%20Spruce%20Dr%2C%20Cody%2C%20WY%2082414!5e0!3m2!1sen!2sus!4v1729387752825!5m2!1sen!2sus" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </li>
            </ul>    
            </div>
        </div>
